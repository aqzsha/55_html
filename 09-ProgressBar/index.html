<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
    <title>Progress Steps</title>
  </head>
  <body>
    <div class="container">
      <div class="progress-container">
        <div
          class="progress"
          id="progress"
        ></div>
        <div class="circle active">
          <img
            src="https://i.pinimg.com/474x/e7/05/ca/e705cac02098569c2f3df55ffc8a5ed8.jpg"
            alt=""
          />
        </div>
        <div class="circle">
          <img
            src="https://i.pinimg.com/474x/d7/1d/92/d71d9255cd0ed9ca2e5bd7fc7a45d8d0.jpg"
            alt=""
          />
        </div>
        <div class="circle">
          <img
            src="https://cdn6.aptoide.com/imgs/0/d/8/0d89b90ee9af17e88c1f2cdd04c2ff7d_icon.png"
            alt=""
          />
        </div>
        <div class="circle">
          <img
            src="https://steamuserimages-a.akamaihd.net/ugc/2019354165155043141/5C8C3B39101554107586A81AA6FAE1743692757B/?imw=512&&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=false"
            alt=""
          />
        </div>
      </div>

      <button
        class="btn"
        id="prev"
        disabled
      >
        Prev
      </button>
      <button
        class="btn"
        id="next"
      >
        Next
      </button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
